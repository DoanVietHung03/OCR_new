events {}
http {
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  map $status $auth_outcome {
    200 success;
    401 failed;
    429 rate_limited;
    default failed;
  }
  log_format auth '$time_iso8601 source=$remote_addr route=$uri outcome=$auth_outcome status=$status duration=$request_time';
  server {
    listen 80;
    location = /health { proxy_pass http://backend:50177/health; }
    location = /_auth {
      internal;
      proxy_pass http://backend:50177/api/auth/session;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }
    location = /login { proxy_pass http://frontend:54846; }
    location = /icon.svg { proxy_pass http://frontend:54846; }
    location ^~ /_next/static/ { proxy_pass http://frontend:54846; }
    location = /api/auth/login {
      access_log /var/log/nginx/auth.log auth;
      limit_req zone=login burst=3 nodelay;
      limit_req_status 429;
      client_max_body_size 16k;
      proxy_pass http://backend:50177;
    }
    location /api/ {
      client_max_body_size 200m;
      proxy_pass http://backend:50177;
    }
    location / {
      auth_request /_auth;
      error_page 401 = @login;
      add_header Cache-Control "no-store" always;
      proxy_pass http://frontend:54846;
    }
    location @login { return 302 /login?returnTo=$request_uri; }
  }
}
