[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr"
version = "0.1.0"
description = "OCR application"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "fastapi>=0.115",
    "PyMuPDF>=1.24",
    "redis>=5.0",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]
