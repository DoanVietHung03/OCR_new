services:
  nginx:
    image: nginx:alpine
    ports: ["10.6.18.1:54846:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "6380"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 50177
    env_file: .env
    environment:
      OCR_DATA_DIR: /data/jobs
      CELERY_BROKER_URL: redis://redis:6380/0
      CELERY_RESULT_BACKEND: redis://redis:6380/1
    volumes:
      - ${OCR_DATA_DIR:-./data/jobs}:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:50177/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    command: celery -A app.workers.tasks:celery_app worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1
    env_file: .env
    environment:
      OCR_DATA_DIR: /data/jobs
      CELERY_BROKER_URL: redis://redis:6380/0
      CELERY_RESULT_BACKEND: redis://redis:6380/1
    volumes:
      - ${OCR_DATA_DIR:-./data/jobs}:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        OCR_BACKEND_URL: http://backend:50177
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:54846').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
